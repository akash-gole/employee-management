<div *ngIf="employees.length === 0" class="no-data-container">
  <img src="assets/images/no-data-found.png" alt="No employee records found" />
</div>

<div *ngIf="employees.length > 0" class="data-container">
  <h3>Current employees</h3>
  <div *ngFor="let employee of currentEmployees" class="employee-card">
    <div class="employee-details">
      <h4>{{ employee.name }}</h4>
      <p>{{ employee.role }}</p>
      <p>From {{ employee.joinDate | date : "d MMM, yyyy" }}</p>
    </div>
  </div>

  <h3>Previous employees</h3>
  <div *ngFor="let employee of previousEmployees" class="employee-card">
    <div class="employee-details">
      <h4>{{ employee.name }}</h4>
      <p>{{ employee.role }}</p>
      <p>
        {{ employee.joinDate | date : "d MMM, yyyy" }} -
        {{ employee.lastDate | date : "d MMM, yyyy" }}
      </p>
    </div>
  </div>
  <div class="swipe-to-delete">
    <p>Swipe left to delete</p>
  </div>

  <div class="fab-container">
    <button
      mat-fab
      color="primary"
      class="button-primary"
      (click)="addEmployee()"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
